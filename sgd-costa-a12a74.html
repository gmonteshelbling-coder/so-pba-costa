function getF(){
  const g=(id,arr)=>{const v=document.getElementById(id).value;return v?arr.indexOf(v):-1;};
  return{l:g("fLoc",D.L),c:g("fCat",D.C),s:g("fSub",D.S),m:g("fMarca",D.M),v:g("fVend",D.V),k:g("fSku",D.K)};
}
function filt(selP){
  const f=getF(),pSet=new Set([...selP].map(p=>D.P.indexOf(p)));
  return D.R.filter(r=>pSet.has(r[0])&&(f.l<0||r[1]===f.l)&&(f.c<0||r[2]===f.c)&&(f.s<0||r[3]===f.s)&&(f.m<0||r[4]===f.m)&&(f.v<0||r[5]===f.v)&&(f.k<0||r[6]===f.k));
}
function filtAll(){
  const f=getF();
  return D.R.filter(r=>(f.l<0||r[1]===f.l)&&(f.c<0||r[2]===f.c)&&(f.s<0||r[3]===f.s)&&(f.m<0||r[4]===f.m)&&(f.v<0||r[5]===f.v)&&(f.k<0||r[6]===f.k));
}
function gSumSO(rows,di){const m={};rows.forEach(r=>{m[r[di]]=(m[r[di]]||0)+r[7];});return Object.entries(m).map(([k,v])=>[+k,v]).sort((a,b)=>b[1]-a[1]);}
function gSumPS(rows,di){const m={};rows.forEach(r=>{m[r[di]]=(m[r[di]]||0)+r[8];});return Object.entries(m).map(([k,v])=>[+k,v]).sort((a,b)=>b[1]-a[1]);}
function gSumCCC(rows,di){
  const seen={},m={};
  rows.forEach(r=>{
    const k=r[di],uid=`${r[0]},${r[1]},${r[5]}`;
    if(!seen[k])seen[k]=new Set();
    if(!seen[k].has(uid)){seen[k].add(uid);m[k]=(m[k]||0)+r[8];}
  });
  return m;
}
function totSO(rows){return rows.reduce((s,r)=>s+r[7],0);}
function totPS(rows){return rows.reduce((s,r)=>s+r[8],0);}
function totCCC(rows){
  const seen=new Set();let t=0;
  rows.forEach(r=>{const uid=`${r[0]},${r[1]},${r[5]}`;if(!seen.has(uid)){seen.add(uid);t+=r[8];}});
  return t;
}
function fmtT(v){const t=v/1000;return t>=1?t.toFixed(2):t.toFixed(3);}
function fmtP(v){const p=v/100;return p>=1000?'$'+(p/1000).toFixed(1)+'M':'$'+p.toFixed(0);}
function fmtC(v){return Math.round(v).toLocaleString('es-AR');}
function pct(a,b){if(!a&&!b)return null;if(!a)return null;return((b-a)/a*100).toFixed(1);}
function dSpan(a,b){const d=pct(a,b);if(d===null)return`<span class="delta delta-eq">N/A</span>`;const cls=+d>0?"delta-up":+d<0?"delta-dn":"delta-eq";return`<span class="delta ${cls}">${+d>0?"+":""}${d}%</span>`;}
function labB(s){const arr=[...s].sort();return arr.length>=7?arr[0].slice(0,4):arr.map(p=>PL[p]||p).join("+")||"—";}
function updTotals(rA,rB){
  document.getElementById("soA").textContent=fmtT(totSO(rA));
  document.getElementById("soB").textContent=fmtT(totSO(rB));
  document.getElementById("cccA").textContent=fmtC(totCCC(rA));

}

function donut(id,labels,values,cols){
  dC(id);const ctx=document.getElementById(id);if(!ctx)return;
  const total=values.reduce((a,b)=>a+b,0);
  new Chart(ctx,{type:"doughnut",data:{labels,datasets:[{data:values,backgroundColor:cols||CL,borderWidth:1,borderColor:"#1a1f2e"}]},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{
        legend:{position:"right",labels:{color:"#8892a0",font:{size:10},boxWidth:11}},
        datalabels:{display:true,color:"#fff",font:{size:10,weight:"bold"},
          formatter:(val)=>total>0?(val/total*100).toFixed(1)+"%":""}
      }
    },
    plugins:[{id:"datalabels",afterDatasetsDraw(chart){
      const{ctx:c,data}=chart;
      const ds=data.datasets[0];
      const total=ds.data.reduce((a,b)=>a+b,0);
      if(!total)return;
      chart.getDatasetMeta(0).data.forEach((arc,i)=>{
        const val=ds.data[i];
        const pct=(val/total*100);
        if(pct<4)return;
        const angle=(arc.startAngle+arc.endAngle)/2;
        const r=(arc.innerRadius+arc.outerRadius)/2;
        const x=arc.x+Math.cos(angle)*r;
        const y=arc.y+Math.sin(angle)*r;
        c.save();
        c.fillStyle="#fff";
        c.font="bold 10px Segoe UI";
        c.textAlign="center";
        c.textBaseline="middle";
        c.fillText(pct.toFixed(1)+"%",x,y);
        c.restore();
      });
    }}]
  });
}

  lineM("cE_cat",pLabels,D.C.map((c,ci)=>({label:c,data:allP.map(p=>catByP[ci]&&catByP[ci][pi(p)]||0),borderColor:CL[ci],backgroundColor:CL[ci]+"22",tension:.3,fill:false,pointRadius:3})));
  lineM("cE_vend",pLabels,top6v.map((vi,i)=>({label:D.V[vi],data:allP.map(p=>vByP[vi]&&vByP[vi][pi(p)]||0),borderColor:CL[i],backgroundColor:CL[i]+"22",tension:.3,fill:false,pointRadius:3})));
  lineM("cE_marca",pLabels,top8m.map((mi,i)=>({label:D.M[mi],data:allP.map(p=>mByP[mi]&&mByP[mi][pi(p)]||0),borderColor:CL[i],backgroundColor:CL[i]+"22",tension:.3,fill:false,pointRadius:3})));
  barG("cE_ccat",D.C,D.C.map((_,ci)=>catSA[ci]||0),D.C.map((_,ci)=>catSB[ci]||0),"2025","2026");
  const catPSA={},catPSB={};
  rA.forEach(r=>{catPSA[r[2]]=(catPSA[r[2]]||0)+r[8];});
  rB.forEach(r=>{catPSB[r[2]]=(catPSB[r[2]]||0)+r[8];});
  barG("cE_cpesos",D.C,D.C.map((_,ci)=>catPSA[ci]||0),D.C.map((_,ci)=>catPSB[ci]||0),"SO$ 2025","SO$ 2026");
}

function showTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach((el,i)=>el.classList.toggle("active",["localidad","categoria","subcategoria","marca","sku","vendedor","evolucion"][i]===t));
  render();
}
function render(){
  if(sA.size===0&&sB.size===0){document.getElementById("main").innerHTML=`<div class="no-data">Seleccioná al menos un período en cada bloque</div>`;return;}
  const rA=filt(sA),rB=filt(sB),main=document.getElementById("main");
  const tabDim={localidad:1,categoria:2,subcategoria:3,marca:4,vendedor:5,sku:6};
  if(curTab in tabDim)renderDim(tabDim[curTab],rA,rB,main,"so");
  else tabEvo(main);
}
initFilters();render();
</script>
</body>
