*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
header{background:linear-gradient(135deg,#1a1f2e,#252b3b);padding:13px 16px;border-bottom:2px solid #00bcd4;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.tabs{display:flex;background:#1a1f2e;border-bottom:1px solid #2d3347;overflow-x:auto;padding:0 8px}
.tab{padding:10px 13px;cursor:pointer;font-size:11px;color:#8892a0;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:#00bcd4;border-bottom-color:#00bcd4;font-weight:700}
.tab:hover{color:#ccc}
.bloques{display:grid;grid-template-columns:1fr 1fr;background:#1a1f2e;border-bottom:1px solid #2d3347}
.bloque{padding:9px 12px}.bloque-a{border-right:1px solid #2d3347}
.bloque-header{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.bloque-label{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.bloque-a .bloque-label{background:rgba(100,181,246,.2);color:#64b5f6}
.bloque-b .bloque-label{background:rgba(255,183,77,.2);color:#ffb74d}
.bloque-totals{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.bloque-total{font-size:10px;color:#8892a0}
.bloque-total b{font-weight:700;color:#ccc}
.pbtn-wrap{display:flex;flex-wrap:wrap;gap:4px}
.pbtn{background:#1e2330;border:1px solid #3d4556;color:#8892a0;padding:3px 8px;border-radius:5px;font-size:10px;cursor:pointer;transition:all .15s}
.pbtn-a.active{background:rgba(100,181,246,.25);border-color:#64b5f6;color:#64b5f6;font-weight:700}
.pbtn-b.active{background:rgba(255,183,77,.25);border-color:#ffb74d;color:#ffb74d;font-weight:700}
.filters{background:#151920;padding:9px 12px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #2d3347;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:9px;color:#8892a0;text-transform:uppercase;letter-spacing:.5px}
select{background:#1e2330;color:#e0e0e0;border:1px solid #3d4556;border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer;min-width:110px}

.main{padding:12px;display:flex;flex-direction:column;gap:12px}
.sec-title{font-size:10px;color:#8892a0;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #2d3347}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px}

.card-value{font-size:18px;font-weight:700;color:#fff}
.card-sub{font-size:10px;color:#8892a0;margin-top:2px}
.card.green .card-value{color:#4caf50}.card.red .card-value{color:#e63329}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chart-box{background:#1a1f2e;border:1px solid #2d3347;border-radius:8px;padding:11px}
.chart-box h3{font-size:10px;color:#8892a0;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.chart-box canvas{max-height:195px}
.chart-box.full{grid-column:1/-1}
.table-wrap{overflow-x:auto;max-height:360px;overflow-y:auto;border-radius:7px;border:1px solid #2d3347}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#1e2330;color:#8892a0;padding:6px 9px;text-align:right;font-weight:600;text-transform:uppercase;font-size:9px;position:sticky;top:0;z-index:1;white-space:nowrap}
th:first-child{text-align:left}
td{padding:5px 9px;border-bottom:1px solid #1a1f2e;color:#ccc;text-align:right;white-space:nowrap}

.th-a{color:#64b5f6!important}.th-b{color:#ffb74d!important}
.rank-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow-y:auto}

.rank-num{font-size:10px;color:#8892a0;width:16px;text-align:center;font-weight:700}
.rank-name{flex:1;font-size:11px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rank-bars{display:flex;flex-direction:column;gap:2px;width:85px;flex-shrink:0}
.rank-bar-row{display:flex;align-items:center;gap:3px}
.rank-bar-wrap{flex:1;height:4px;background:#0f1117;border-radius:2px;overflow:hidden}
.rank-bar{height:100%;border-radius:2px}
.rank-bar-a{background:#64b5f6}.rank-bar-b{background:#ffb74d}
.rank-val{font-size:10px;width:55px;text-align:right;font-weight:600;flex-shrink:0}

        c.fillStyle="#fff";
        c.font="bold 10px Segoe UI";
        c.textAlign="center";
        c.textBaseline="middle";
        c.fillText(pct.toFixed(1)+"%",x,y);
        c.restore();
      });
    }}]
  });
}

function renderDim(di,rA,rB,main,metric){
  const dimArr=DIMS[di];
  const dimLabel=["","Localidad","Categoría","Subcategoría","Marca","Vendedor","SKU"][di];
  const isPesos=metric==="pesos";
  const showCCC=!isPesos&&(di===1||di===5);
  const sA_=gSumSO(rA,di);
  const sB_=gSumSO(rB,di);
  const mA=Object.fromEntries(sA_),mB=Object.fromEntries(sB_);
  const cA=gSumCCC(rA,di),cB=gSumCCC(rB,di);
  const allK=[...new Set([...sA_.map(([k])=>k),...sB_.map(([k])=>k)])];
  allK.sort((a,b)=>((mA[b]||0)+(mB[b]||0))-((mA[a]||0)+(mB[a]||0)));
  var allK2=allK.filter(function(k){return (mA[k]||0)>0||(mB[k]||0)>0||(showCCC&&((cA[k]||0)>0||(cB[k]||0)>0));});allK.length=0;allK2.forEach(function(k){allK.push(k);});
  const tA=isPesos?0:totSO(rA),tB=isPesos?0:totSO(rB);
  const tcA=totCCC(rA),tcB=totCCC(rB);
  const dp=pct(tA,tB),dpC=pct(tcA,tcB);
  updTotals(rA,rB);
  const top10=allK.slice(0,10),maxV=Math.max(...allK.map(k=>Math.max(mA[k]||0,mB[k]||0)),1);
  const lA=labB(sA),lB_=labB(sB);
  const fmt=fmtT;
  const metLabel="SO (T)";

  // Note for pesos tabs
  const pesoNote="";

  main.innerHTML=`
  ${pesoNote}
  <div class="cards">
    <div class="card"><div class="card-label">${metLabel} 2025</div><div class="card-value" style="color:${CA}">${fmt(tA)}</div><div class="card-sub">${lA}</div></div>
    <div class="card"><div class="card-label">${metLabel} 2026</div><div class="card-value" style="color:${CB}">${fmt(tB)}</div><div class="card-sub">${lB_}</div></div>
    <div class="card ${dp===null?"":+dp>=0?"green":"red"}"><div class="card-label">Var 2026 vs 2025</div><div class="card-value">${dp!==null?(+dp>0?"+":"")+dp+"%":"N/A"}</div><div class="card-sub">${allK.length} ${dimLabel.toLowerCase()}s</div></div>
    ${showCCC?`<div class="card"><div class="card-label">CCC prom./mes 2025</div><div class="card-value" style="color:${CA};font-size:15px">${fmtC(tcA)}</div></div>
    <div class="card"><div class="card-label">CCC prom./mes 2026</div><div class="card-value" style="color:${CB};font-size:15px">${fmtC(tcB)}</div></div>
    <div class="card ${dpC===null?"":+dpC>=0?"green":"red"}"><div class="card-label">Var CCC</div><div class="card-value">${dpC!==null?(+dpC>0?"+":"")+dpC+"%":"N/A"}</div></div>`:""}
  </div>
  <div class="chart-box full"><h3>${metLabel} 2025 vs 2026 — ${dimLabel}s</h3><canvas id="cD_main"></canvas></div>
  <div class="row-2">
    <div class="chart-box"><h3>Mix 2025</h3><canvas id="cD_pA"></canvas></div>
    <div class="chart-box"><h3>Mix 2026</h3><canvas id="cD_pB"></canvas></div>
  </div>
  <div><div class="sec-title">Ranking</div>
  <div class="rank-list">${allK.map((k,i)=>{
    const vA=mA[k]||0,vB=mB[k]||0,name=dimArr[k];
    return`<div class="rank-item">
      <div class="rank-num">${i+1}</div><div class="rank-name" title="${name}">${name}</div>
      <div class="rank-bars">
        <div class="rank-bar-row"><div class="rank-bar-wrap"><div class="rank-bar rank-bar-a" style="width:${(vA/maxV*100).toFixed(0)}%"></div></div><span class="rank-val rank-val-a">${fmt(vA)}</span></div>
        <div class="rank-bar-row"><div class="rank-bar-wrap"><div class="rank-bar rank-bar-b" style="width:${(vB/maxV*100).toFixed(0)}%"></div></div><span class="rank-val rank-val-b">${fmt(vB)}</span></div>
      </div>${dSpan(vA,vB)}</div>`;
  }).join("")}</div></div>
  <div><div class="sec-title">Tabla</div>
  <div class="table-wrap"><table>
    <tr><th>${dimLabel}</th><th class="th-a">2025</th><th class="th-b">2026</th><th>Var</th>${showCCC?`<th class="th-a">CCC 25</th><th class="th-b">CCC 26</th><th>Var CCC</th>`:""}</tr>
    ${allK.map(k=>{
      const vA=mA[k]||0,vB=mB[k]||0,ccA=cA[k]||0,ccB=cB[k]||0;
      const dS=pct(vA,vB),dC_=pct(ccA,ccB),n=dimArr[k];
      return`<tr><td title="${n}">${n}</td>
        <td style="color:${CA}">${fmt(vA)}</td><td style="color:${CB}">${fmt(vB)}</td>
        <td style="color:${dS===null?"#aaa":+dS>=0?"#4caf50":"#e63329"}">${dS!==null?(+dS>0?"+":"")+dS+"%":"N/A"}</td>
        ${showCCC?`<td style="color:${CA}">${fmtC(ccA)}</td><td style="color:${CB}">${fmtC(ccB)}</td>
        <td style="color:${dC_===null?"#aaa":+dC_>=0?"#4caf50":"#e63329"}">${dC_!==null?(+dC_>0?"+":"")+dC_+"%":"N/A"}</td>`:""}
      </tr>`;
    }).join("")}
  </table></div></div>`;

  barG("cD_main",top10.map(k=>dimArr[k]),top10.map(k=>mA[k]||0),top10.map(k=>mB[k]||0),"2025","2026");
  donut("cD_pA",sA_.slice(0,9).map(([k])=>dimArr[k]),sA_.slice(0,9).map(([,v])=>v));
  donut("cD_pB",sB_.slice(0,9).map(([k])=>dimArr[k]),sB_.slice(0,9).map(([,v])=>v),CL.map(c=>c+"bb"));
}

function tabEvo(main){
  const allP=D.P.slice().sort(),pLabels=allP.map(p=>PL[p]||p);
  const all=filtAll();
  const aIdx=new Set([...sA].map(p=>D.P.indexOf(p))),bIdx=new Set([...sB].map(p=>D.P.indexOf(p)));
  const rA=filt(sA),rB=filt(sB);
  updTotals(rA,rB);
  const lA=labB(sA),lB_=labB(sB);
  const pi=p=>D.P.indexOf(p);

  const totByP={},pesosbyP={},cccByP={},cccSeen={};
  all.forEach(r=>{
    totByP[r[0]]=(totByP[r[0]]||0)+r[7];
    pesosbyP[r[0]]=(pesosbyP[r[0]]||0)+r[8];
    const uid=`${r[1]},${r[5]}`;
    if(!cccSeen[r[0]])cccSeen[r[0]]=new Set();
    if(!cccSeen[r[0]].has(uid)){cccSeen[r[0]].add(uid);cccByP[r[0]]=(cccByP[r[0]]||0)+r[8];}
  });
  const catByP={};all.forEach(r=>{if(!catByP[r[2]])catByP[r[2]]={};catByP[r[2]][r[0]]=(catByP[r[2]][r[0]]||0)+r[7];});
  const vTot={};all.forEach(r=>{vTot[r[5]]=(vTot[r[5]]||0)+r[7];});
  const top6v=Object.entries(vTot).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k])=>+k);
  const vByP={};all.filter(r=>top6v.includes(r[5])).forEach(r=>{if(!vByP[r[5]])vByP[r[5]]={};vByP[r[5]][r[0]]=(vByP[r[5]][r[0]]||0)+r[7];});
  const mTot={};all.forEach(r=>{mTot[r[4]]=(mTot[r[4]]||0)+r[7];});
  const top8m=Object.entries(mTot).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>+k);
  const mByP={};all.filter(r=>top8m.includes(r[4])).forEach(r=>{if(!mByP[r[4]])mByP[r[4]]={};mByP[r[4]][r[0]]=(mByP[r[4]][r[0]]||0)+r[7];});
  const catSA={},catSB={};
  rA.forEach(r=>{catSA[r[2]]=(catSA[r[2]]||0)+r[7];});
  rB.forEach(r=>{catSB[r[2]]=(catSB[r[2]]||0)+r[7];});
  const aIdxArr=allP.map(p=>aIdx.has(pi(p))),bIdxArr=allP.map(p=>bIdx.has(pi(p)));

  main.innerHTML=`
  <div class="row-2">
    <div class="chart-box"><h3>Total SO (T) mensual</h3><canvas id="cE_so"></canvas></div>
    <div class="chart-box"><h3>Clientes con compra por mes</h3><canvas id="cE_ccc"></canvas></div>
  </div>
  <div class="chart-box full"><h3>SO ($) mensual — desde Jul 25/26</h3><canvas id="cE_ps"></canvas></div>
  <div class="chart-box full"><h3>SO (T) por categoría</h3><canvas id="cE_cat"></canvas></div>
  <div class="chart-box full"><h3>Top 6 vendedores — SO (T)</h3><canvas id="cE_vend"></canvas></div>
  <div class="chart-box full"><h3>Top 8 marcas — SO (T)</h3><canvas id="cE_marca"></canvas></div>
  <div class="row-2">
    <div class="chart-box"><h3>2025 vs 2026 — SO (T) por categoría</h3><canvas id="cE_ccat"></canvas></div>
    <div class="chart-box"><h3>2025 vs 2026 — SO ($) por categoría</h3><canvas id="cE_cpesos"></canvas></div>
  </div>`;

  const ptStyle=allP.map((_,i)=>aIdxArr[i]?CA:bIdxArr[i]?CB:AC);
  const ptSize=allP.map((_,i)=>aIdxArr[i]||bIdxArr[i]?6:3);
  lineM("cE_so",pLabels,[{label:"SO (T)",data:allP.map(p=>totByP[pi(p)]||0),borderColor:AC,backgroundColor:AC+"22",tension:.3,fill:true,pointRadius:ptSize,pointBackgroundColor:ptStyle}]);
  lineM("cE_ccc",pLabels,[{label:"CCC",data:allP.map(p=>cccByP[pi(p)]||0),borderColor:"#4caf50",backgroundColor:"#4caf5022",tension:.3,fill:true,pointRadius:ptSize,pointBackgroundColor:ptStyle.map(c=>c===AC?"#4caf50":c)}]);
  lineM("cE_ps",pLabels,[{label:"SO ($)",data:allP.map(p=>pesosbyP[pi(p)]||0),borderColor:"#ffeb3b",backgroundColor:"#ffeb3b22",tension:.3,fill:true,pointRadius:ptSize,pointBackgroundColor:ptStyle.map(c=>c===AC?"#ffeb3b":c)}]);
  lineM("cE_cat",pLabels,D.C.map((c,ci)=>({label:c,data:allP.map(p=>catByP[ci]&&catByP[ci][pi(p)]||0),borderColor:CL[ci],backgroundColor:CL[ci]+"22",tension:.3,fill:false,pointRadius:3})));
  lineM("cE_vend",pLabels,top6v.map((vi,i)=>({label:D.V[vi],data:allP.map(p=>vByP[vi]&&vByP[vi][pi(p)]||0),borderColor:CL[i],backgroundColor:CL[i]+"22",tension:.3,fill:false,pointRadius:3})));
  lineM("cE_marca",pLabels,top8m.map((mi,i)=>({label:D.M[mi],data:allP.map(p=>mByP[mi]&&mByP[mi][pi(p)]||0),borderColor:CL[i],backgroundColor:CL[i]+"22",tension:.3,fill:false,pointRadius:3})));
  barG("cE_ccat",D.C,D.C.map((_,ci)=>catSA[ci]||0),D.C.map((_,ci)=>catSB[ci]||0),"2025","2026");
  const catPSA={},catPSB={};
  rA.forEach(r=>{catPSA[r[2]]=(catPSA[r[2]]||0)+r[8];});
  rB.forEach(r=>{catPSB[r[2]]=(catPSB[r[2]]||0)+r[8];});
  barG("cE_cpesos",D.C,D.C.map((_,ci)=>catPSA[ci]||0),D.C.map((_,ci)=>catPSB[ci]||0),"SO$ 2025","SO$ 2026");
}

function showTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach((el,i)=>el.classList.toggle("active",["localidad","categoria","subcategoria","marca","sku","vendedor","evolucion"][i]===t));
  render();
}
function render(){
  if(sA.size===0&&sB.size===0){document.getElementById("main").innerHTML=`<div class="no-data">Seleccioná al menos un período en cada bloque</div>`;return;}
  const rA=filt(sA),rB=filt(sB),main=document.getElementById("main");
  const tabDim={localidad:1,categoria:2,subcategoria:3,marca:4,vendedor:5,sku:6};
  if(curTab in tabDim)renderDim(tabDim[curTab],rA,rB,main,"so");
  else tabEvo(main);
}
initFilters();render();
</script>
</body>
</html>
